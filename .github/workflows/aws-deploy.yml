name: AWS - Deploy Infrastructure & Apps

on:
  push:
    branches: [main, develop]
    paths:
      - 'infrastructure/aws_*.tf'
      - 'infrastructure/aws_*.tfvars'
      - 'infrastructure/lambda_function.py'
      - 'lib/**'
      - 'pubspec.yaml'
      - '.github/workflows/aws-deploy.yml'
  workflow_dispatch:

env:
  AWS_REGION: ap-south-1
  TERRAFORM_VERSION: 1.5.0

jobs:
  # ============================================
  # Terraform Plan & Apply
  # ============================================
  terraform-plan:
    name: Terraform Plan - AWS Infrastructure
    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: ./infrastructure
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
      
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
      
      - name: Bootstrap Terraform state bucket
        run: |
          BUCKET=iq-games-tfstate-880453910905
          if ! aws s3api head-bucket --bucket "$BUCKET" 2>/dev/null; then
            aws s3api create-bucket --bucket "$BUCKET" --region ${{ env.AWS_REGION }} \
              --create-bucket-configuration LocationConstraint=${{ env.AWS_REGION }}
            aws s3api put-bucket-versioning --bucket "$BUCKET" \
              --versioning-configuration Status=Enabled
          fi
      
      - name: Initialize Terraform
        run: terraform init
      
      - name: Validate Terraform
        run: terraform validate
      
      - name: Format check
        run: terraform fmt -check -recursive
        continue-on-error: true
      
      - name: Package Lambda function
        run: zip -j lambda_function.zip lambda_function.py
      
      - name: Plan Terraform
        id: plan
        run: terraform plan -var-file=aws_terraform.tfvars -out=tfplan
      
      - name: Upload plan artifact
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan
          path: infrastructure/tfplan
          retention-days: 1
      
      - name: Comment on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: 'Terraform plan completed. Infrastructure changes ready for review.'
            });

  terraform-apply:
    name: Terraform Apply - Deploy to AWS
    runs-on: ubuntu-latest
    needs: terraform-plan
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    
    defaults:
      run:
        working-directory: ./infrastructure
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
      
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
      
      - name: Bootstrap Terraform state bucket
        run: |
          BUCKET=iq-games-tfstate-880453910905
          if ! aws s3api head-bucket --bucket "$BUCKET" 2>/dev/null; then
            aws s3api create-bucket --bucket "$BUCKET" --region ${{ env.AWS_REGION }} \
              --create-bucket-configuration LocationConstraint=${{ env.AWS_REGION }}
            aws s3api put-bucket-versioning --bucket "$BUCKET" \
              --versioning-configuration Status=Enabled
          fi
      
      - name: Initialize Terraform
        run: terraform init
      
      - name: Download plan artifact
        uses: actions/download-artifact@v4
        with:
          name: terraform-plan
          path: infrastructure/
      
      - name: Package Lambda function
        run: zip -j lambda_function.zip lambda_function.py
      
      - name: Adopt existing resources into remote state (idempotent)
        run: |
          set +e
          API_ID=onll8tjd6h
          RID=iq-games
          ENV=dev
          BUCKET=iq-games-dev-assets-880453910905
          POOL=ap-south-1_Y0g7ExwDs
          CLIENT=7c9s4754ffpjmqs3n5dird2m74

          imp() { terraform state list | grep -qx "$1" || terraform import -var-file=aws_terraform.tfvars "$1" "$2"; }

          imp aws_dynamodb_table.users        "$RID-$ENV-users"
          imp aws_dynamodb_table.scores       "$RID-$ENV-scores"
          imp aws_dynamodb_table.leaderboards "$RID-$ENV-leaderboards"
          imp aws_cognito_user_pool.main        "$POOL"
          imp aws_cognito_user_pool_client.app  "$POOL/$CLIENT"
          imp aws_s3_bucket.game_assets                    "$BUCKET"
          imp aws_s3_bucket_versioning.game_assets         "$BUCKET"
          imp aws_s3_bucket_lifecycle_configuration.game_assets "$BUCKET"
          imp aws_s3_bucket_public_access_block.game_assets     "$BUCKET"
          imp aws_iam_role.lambda_role "$RID-lambda-role"
          imp aws_iam_role_policy_attachment.lambda_basic "$RID-lambda-role/arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole"
          imp aws_iam_role_policy.lambda_dynamodb "$RID-lambda-role:$RID-lambda-dynamodb"
          imp aws_iam_role_policy.lambda_s3       "$RID-lambda-role:$RID-lambda-s3"
          imp aws_lambda_function.leaderboard_api "$RID-leaderboard-api"
          imp aws_apigatewayv2_api.main   "$API_ID"
          imp aws_apigatewayv2_stage.main "$API_ID/$ENV"
          INTEG_ID=$(aws apigatewayv2 get-integrations --api-id "$API_ID" --query 'Items[0].IntegrationId' --output text)
          [ -n "$INTEG_ID" ] && [ "$INTEG_ID" != "None" ] && imp aws_apigatewayv2_integration.lambda "$API_ID/$INTEG_ID"
          ROUTE_ID=$(aws apigatewayv2 get-routes --api-id "$API_ID" --query "Items[?RouteKey=='GET /leaderboard/{gameId}'].RouteId | [0]" --output text)
          [ -n "$ROUTE_ID" ] && [ "$ROUTE_ID" != "None" ] && imp aws_apigatewayv2_route.leaderboard "$API_ID/$ROUTE_ID"
          imp aws_lambda_permission.api_gateway "$RID-leaderboard-api/AllowAPIGatewayInvoke"
          imp aws_cloudwatch_log_group.api_gateway "/aws/apigateway/$RID"
          imp aws_cloudwatch_log_group.lambda      "/aws/lambda/$RID"
          imp aws_cloudwatch_metric_alarm.lambda_errors     "$RID-lambda-errors"
          imp aws_cloudwatch_metric_alarm.dynamodb_throttle "$RID-dynamodb-throttle"
          exit 0
      
      - name: Apply Terraform
        run: terraform apply -var-file=aws_terraform.tfvars -auto-approve -lock=false
      
      - name: Save outputs
        run: terraform output -json > /tmp/terraform-outputs.json
      
      - name: Upload outputs
        uses: actions/upload-artifact@v4
        with:
          name: terraform-outputs
          path: /tmp/terraform-outputs.json
      
      - name: Post deployment status
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            try {
              const outputs = JSON.parse(fs.readFileSync('/tmp/terraform-outputs.json', 'utf8'));
              github.rest.issues.createComment({
                issue_number: context.issue.number || 1,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: `AWS Infrastructure Deployed\n\n**API Endpoint:** ${outputs.api_endpoint.value}\n**Region:** ap-south-1`
              });
            } catch(e) {
              console.log('Could not post deployment status');
            }

  # ============================================
  # Flutter App Build
  # ============================================
  build-android:
    name: Build Android App
    runs-on: ubuntu-latest
    needs: terraform-apply
    if: github.ref == 'refs/heads/main'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'adopt'
      
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: stable
      
      - name: Generate platform folders
        run: flutter create --org com.iqgames --platforms=android .
      
      - name: Install dependencies
        run: flutter pub get
      
      - name: Build APK
        run: flutter build apk --release
      
      - name: Build App Bundle
        run: flutter build appbundle --release
      
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release.apk
          path: build/app/outputs/flutter-apk/app-release.apk
      
      - name: Upload App Bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release.aab
          path: build/app/outputs/bundle/release/app-release.aab

  build-ios:
    name: Build iOS App
    runs-on: macos-latest
    needs: terraform-apply
    if: github.ref == 'refs/heads/main'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: stable
      
      - name: Generate platform folders
        run: flutter create --org com.iqgames --platforms=ios .
      
      - name: Install dependencies
        run: flutter pub get
      
      - name: Build iOS
        run: flutter build ios --release --no-codesign
        continue-on-error: true
      
      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release.ipa
          path: build/ios/ipa/iq_games.ipa
          if-no-files-found: warn

  # ============================================
  # Notifications
  # ============================================
  notify:
    name: Send Notifications
    runs-on: ubuntu-latest
    needs: [terraform-apply, build-android, build-ios]
    if: always()
    
    steps:
      - name: Deployment Summary
        run: |
          echo "=== AWS Deployment Summary ==="
          echo "Terraform: ${{ needs.terraform-apply.result }}"
          echo "Android: ${{ needs.build-android.result }}"
          echo "iOS: ${{ needs.build-ios.result }}"
      
      - name: Slack Notification
        if: failure() && env.SLACK_WEBHOOK != ''
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
        uses: slackapi/slack-github-action@v1.24.0
        with:
          webhook-url: ${{ secrets.SLACK_WEBHOOK }}
          payload: |
            {
              "text": "IQ Games AWS Deployment Failed",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*Deployment Status*\n Terraform: ${{ needs.terraform-apply.result }}\n Android: ${{ needs.build-android.result }}\n iOS: ${{ needs.build-ios.result }}"
                  }
                }
              ]
            }
