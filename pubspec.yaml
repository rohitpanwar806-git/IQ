name: iq_games
description: "A free, lightweight mobile game featuring multiple IQ challenges with cloud-based leaderboards."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Networking (talks to the AWS API Gateway endpoint over HTTPS)
  http: ^1.2.0

  # UI & Navigation
  cupertino_icons: ^1.0.6
  go_router: ^13.0.0

  # Local persistence & utilities
  shared_preferences: ^2.2.0
  uuid: ^4.0.0
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
